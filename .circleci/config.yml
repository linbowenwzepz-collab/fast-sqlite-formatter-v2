version: 2.1

jobs:
  route_v6-preview4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fold integer series
          command: |
            mkdir -p /tmp/data
            { set +o pipefail 2>/dev/null; seq 1 491399 | awk '{if($1%97==0)c++}END{print c}'; true ; } > /tmp/data/31.data
            echo "gate v6-preview4: $(wc -c </tmp/data/31.data) bytes total"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - 31.data
  v6-preview4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Load artifact
          command: |
            cat /tmp/data/31.data
      - run:
          name: Prepare source
          command: git clone --depth 1 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: tar -I bzip2 -xf release-pkg.tar.bz2
      - run:
          name: Index artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Finalize build
          command: g++ --version
      - run:
          name: Package artifacts
          command: g++ --version
      - run:
          no_output_timeout: 80m
          command: env ./adapter
